import java.nio.ByteBuffer
import java.nio.ByteOrder
import java.util.regex.Matcher

plugins {
    id 'java'
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.0.14'
    id 'jacoco'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

group = 'com.viruchith.promptbutler'
version = '0.5.0'

def envProfile = (project.findProperty('env') ?: 'prod').toString().toLowerCase()

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

configurations {
    linuxAarch64Natives
}

dependencies {
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'com.github.kwhat:jnativehook:2.2.2'
    implementation 'org.kordamp.ikonli:ikonli-javafx:12.3.1'
    implementation 'org.kordamp.ikonli:ikonli-fontawesome5-pack:12.3.1'
    implementation 'org.slf4j:slf4j-api:2.0.17'
    runtimeOnly 'ch.qos.logback:logback-classic:1.5.18'

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.mockito:mockito-core:5.11.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.11.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // ── Cross-platform fat JAR support ──────────────────────────────────────
    // org.openjfx.javafxplugin resolves only the current-OS native JAR.
    // Explicitly declare all platform classifiers so shadowJar bundles natives
    // for every supported OS. JavaFX PlatformUtil selects the right one at runtime.
    ['win', 'linux', 'mac', 'mac-aarch64'].each { platform ->
        ['javafx-base', 'javafx-controls', 'javafx-graphics'].each { module ->
            runtimeOnly "org.openjfx:${module}:21.0.6:${platform}"
        }
    }

    // OpenJFX does not publish 21.0.6 for linux-aarch64 to Maven Central.
    // We resolve linux-aarch64 from 21.0.11 and package its native .so libraries
    // into native/linux-aarch64/ within the fat JAR.
    linuxAarch64Natives 'org.openjfx:javafx-graphics:21.0.11:linux-aarch64'
}

javafx {
    version = '21.0.6'
    modules = ['javafx.controls', 'javafx.graphics']
}

def javafxArtifactsVersion = javafx.version

application {
    mainClass = 'com.viruchith.PromptButler.PromptButlerApp'
    // Glass / UFT: valid once JavaFX is on --module-path (see startScripts rewrite below).
    applicationDefaultJvmArgs = [
            '-Dfile.encoding=UTF-8',
            '--add-exports=javafx.graphics/com.sun.glass.ui=ALL-UNNAMED',
            '--add-opens=javafx.graphics/com.sun.glass.ui=ALL-UNNAMED'
    ]
}

jar {
    manifest {
        attributes(
                'Implementation-Title': 'Prompt Butler',
                'Implementation-Version': version
        )
    }
}

compileJava {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xlint:deprecation']
    if (envProfile == 'prod') {
        options.compilerArgs += ['-Xlint:all']
    }
}

tasks.named('run', JavaExec) { JavaExec exec ->
    systemProperty 'prompt.butler.profile', envProfile
    // Micro Focus UFT injects via JAVA_TOOL_OPTIONS / _JAVA_OPTIONS; fork the app without those
    // so JavaFX is not instrumented (avoids Glass IllegalAccessError and "Can't create support object for Scene").
    def keepUftJvmHooks = (project.findProperty('keepUftJvmHooks')?.toString() == 'true')
    exec.doFirst {
        if (!keepUftJvmHooks) {
            def env = new LinkedHashMap<String, String>(System.getenv())
            env.remove('JAVA_TOOL_OPTIONS')
            env.remove('_JAVA_OPTIONS')
            exec.setEnvironment(env)
        }
    }
}


tasks.register('runDevDebugVisibleLogs', JavaExec) { JavaExec exec ->
    group = 'application'
    description = 'Internal JavaFX-aware dev run task used by runDebugVisibleLogs.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = application.mainClass
    systemProperty 'prompt.butler.profile', 'dev'
    modularity.inferModulePath = true
    jvmArgs(
            '-Dfile.encoding=UTF-8',
            '--add-modules', 'javafx.controls,javafx.graphics',
            '--add-exports=javafx.graphics/com.sun.glass.ui=ALL-UNNAMED',
            '--add-opens=javafx.graphics/com.sun.glass.ui=ALL-UNNAMED'
    )
    doFirst {
        def runtimeArtifacts = configurations.runtimeClasspath.resolvedConfiguration.resolvedArtifacts
        List<String> javafxModulePath = runtimeArtifacts.findAll { artifact ->
            artifact.moduleVersion.id.group == 'org.openjfx' && artifact.classifier
        }.collect { artifact ->
            artifact.file.absolutePath
        }.unique()
        if (javafxModulePath.isEmpty()) {
            throw new GradleException('No JavaFX runtime artifacts were found for runDevDebugVisibleLogs.')
        }
        exec.jvmArgs '--module-path', javafxModulePath.join(File.pathSeparator)
    }
    // Micro Focus UFT injects via JAVA_TOOL_OPTIONS / _JAVA_OPTIONS; fork the app without those
    // so JavaFX is not instrumented (avoids Glass IllegalAccessError and "Can\'t create support object for Scene").
    def keepUftJvmHooks = (project.findProperty('keepUftJvmHooks')?.toString() == 'true')
    exec.doFirst {
        if (!keepUftJvmHooks) {
            def env = new LinkedHashMap<String, String>(System.getenv())
            env.remove('JAVA_TOOL_OPTIONS')
            env.remove('_JAVA_OPTIONS')
            exec.setEnvironment(env)
        }
    }
}

tasks.named('test', Test) {
    useJUnitPlatform()
    systemProperty 'prompt.butler.profile', envProfile
    jvmArgs '-Djava.awt.headless=true'
    environment 'NO_AT_BRIDGE', '1'
}

jacoco {
    toolVersion = '0.8.11'
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

jacocoTestCoverageVerification {
    dependsOn test
    violationRules {
        rule {
            element = 'BUNDLE'
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.80
            }
        }
    }
}

// installDist runs "java -cp …" by default; OpenJFX 11+ needs JavaFX on --module-path + --add-modules.
// Rewrite start scripts: move platform javafx-(base|graphics|controls)-*-(win|linux|mac…).jar off CLASSPATH.
startScripts {
    doLast {
        def isPlatformJavafxJar = { String entry ->
            def n = entry.replace('\\', '/')
            (n =~ /javafx-(base|graphics|controls)-\d+\.\d+\.\d+-(win|linux|mac|mac-aarch64)\.jar$/).find()
        }
        def isJavafxProjectJar = { String entry ->
            def base = entry.replace('\\', '/').tokenize('/').last()
            base.startsWith('javafx-')
        }

        // --- Windows ---
        String ws = windowsScript.text.replace('\r\n', '\n')
        if (!ws.contains('@rem Clear UFT JVM hooks')) {
            ws = ws.replace(
                    ':execute\n@rem Setup the command line',
                    ':execute\n@rem Clear UFT JVM hooks (can break OpenJFX Glass)\nset "JAVA_TOOL_OPTIONS="\nset "_JAVA_OPTIONS="\n@rem Setup the command line'
            )
        }
        // GUI: launch with javaw.exe so Windows does not open a console window (java.exe still used for -version probe).
        if (!ws.contains('set JAVAW_EXE=')) {
            ws = ws.replace(
                    'set JAVA_EXE=java.exe\n%JAVA_EXE% -version',
                    'set JAVA_EXE=java.exe\nset JAVAW_EXE=javaw.exe\n%JAVA_EXE% -version'
            )
            ws = ws.replace(
                    'set JAVA_EXE=%JAVA_HOME%/bin/java.exe\n\nif exist "%JAVA_EXE%" goto execute',
                    'set JAVA_EXE=%JAVA_HOME%/bin/java.exe\nset JAVAW_EXE=%JAVA_HOME%/bin/javaw.exe\n\nif exist "%JAVA_EXE%" goto execute'
            )
        }
        def winCpMatcher = ws =~ /(?m)^set CLASSPATH=(.*)$/
        if (!winCpMatcher.find()) {
            throw new GradleException('startScripts: set CLASSPATH= not found in windows script')
        }
        List<String> winEntries = winCpMatcher.group(1).split(';').collect { it.trim() }.findAll { !it.isEmpty() }
        List<String> winFx = winEntries.findAll { isPlatformJavafxJar(it) }.sort()
        List<String> winRest = winEntries.findAll { !isJavafxProjectJar(it) }
        if (winFx.isEmpty()) {
            throw new GradleException("startScripts: no platform javafx-*.jar on CLASSPATH (entries: ${winEntries})")
        }
        String winMp = winFx.join(';')
        String winCpNew = winRest.join(';')
        ws = ws.replaceFirst(/(?m)^set CLASSPATH=.*$/,
                Matcher.quoteReplacement("set JAVAFX_MODULE_PATH=${winMp}\nset CLASSPATH=${winCpNew}"))
        def winLaunchLine = 'start "" "%JAVAW_EXE%" %DEFAULT_JVM_OPTS% %JAVA_OPTS% %PROMPT_BUTLER_OPTS% --module-path "%JAVAFX_MODULE_PATH%" --add-modules javafx.controls,javafx.graphics,javafx.base -classpath "%CLASSPATH%" com.viruchith.PromptButler.PromptButlerApp %*'
        def winOldClasspathOnly = /"%JAVA_EXE%" %DEFAULT_JVM_OPTS% %JAVA_OPTS% %PROMPT_BUTLER_OPTS%\s+-classpath "%CLASSPATH%" com\.viruchith\.PromptButler\.PromptButlerApp %\*/
        def winOldMpJavaExe = /"%JAVA_EXE%" %DEFAULT_JVM_OPTS% %JAVA_OPTS% %PROMPT_BUTLER_OPTS%\s+--module-path "%JAVAFX_MODULE_PATH%" --add-modules javafx\.controls,javafx\.graphics,javafx\.base -classpath "%CLASSPATH%" com\.viruchith\.PromptButler\.PromptButlerApp %\*/
        if ((ws =~ winOldClasspathOnly).find()) {
            ws = ws.replaceFirst(winOldClasspathOnly, Matcher.quoteReplacement(winLaunchLine))
        } else if ((ws =~ winOldMpJavaExe).find()) {
            ws = ws.replaceFirst(winOldMpJavaExe, Matcher.quoteReplacement(winLaunchLine))
        } else {
            throw new GradleException('startScripts: windows java launch line not matched (expected classpath-only or java.exe + module-path)')
        }
        windowsScript.write(ws.replace('\n', '\r\n'))

        // --- Unix ---
        String us = unixScript.text
        if (!us.contains('unset JAVA_TOOL_OPTIONS')) {
            us = us.replace(
                    'APP_HOME=$( cd "${APP_HOME:-./}.." > /dev/null && pwd -P ) || exit\n\n# Use the maximum available',
                    'APP_HOME=$( cd "${APP_HOME:-./}.." > /dev/null && pwd -P ) || exit\n\n# Clear UFT JVM hooks (can break OpenJFX Glass)\nunset JAVA_TOOL_OPTIONS 2>/dev/null || :\nunset _JAVA_OPTIONS 2>/dev/null || :\n\n# Use the maximum available'
            )
        }
        def unixCpMatcher = us =~ /(?m)^CLASSPATH=(.*)$/
        if (!unixCpMatcher.find()) {
            throw new GradleException('startScripts: CLASSPATH= not found in unix script')
        }
        List<String> unixEntries = unixCpMatcher.group(1).split(':').collect { it.trim() }.findAll { !it.isEmpty() }
        List<String> unixFx = unixEntries.findAll { isPlatformJavafxJar(it) }.sort()
        List<String> unixRest = unixEntries.findAll { !isJavafxProjectJar(it) }
        if (unixFx.isEmpty()) {
            throw new GradleException("startScripts: no platform javafx jars in unix CLASSPATH (entries: ${unixEntries})")
        }
        String unixMp = unixFx.join(':')
        String unixCpNew = unixRest.join(':')
        us = us.replaceFirst(/(?m)^CLASSPATH=.*$/,
                Matcher.quoteReplacement("JAVAFX_MODULE_PATH=${unixMp}\nCLASSPATH=${unixCpNew}"))
        us = us.replace(
                '''set -- \
        -classpath "$CLASSPATH" \
''',
                '''set -- \
        --module-path "$JAVAFX_MODULE_PATH" \
        --add-modules javafx.controls,javafx.graphics,javafx.base \
        -classpath "$CLASSPATH" \
'''
        )
        if (!us.contains('JAVAFX_MODULE_PATH=$( cygpath')) {
            us = us.replace(
                    '    CLASSPATH=$( cygpath --path --mixed "$CLASSPATH" )',
                    '    CLASSPATH=$( cygpath --path --mixed "$CLASSPATH" )\n    JAVAFX_MODULE_PATH=$( cygpath --path --mixed "$JAVAFX_MODULE_PATH" )'
            )
        }
        unixScript.text = us
    }
}

afterEvaluate {
    def coreTree = fileTree(dir: file("$buildDir/classes/java/main"), includes: ['**/com/viruchith/PromptButler/core/**'])
    jacocoTestReport {
        classDirectories.setFrom(files(coreTree))
    }
    jacocoTestCoverageVerification {
        classDirectories.setFrom(files(coreTree))
    }
}

check.dependsOn jacocoTestCoverageVerification

// ── Fat JAR (cross-platform) ─────────────────────────────────────────────────
// Produces build/libs/prompt-butler-<version>-all.jar.
// Bundles JavaFX natives for win / linux / mac / mac-aarch64.
// Run with:
//   java --add-exports=javafx.graphics/com.sun.glass.ui=ALL-UNNAMED \
//        --add-opens=javafx.graphics/com.sun.glass.ui=ALL-UNNAMED \
//        -jar build/libs/prompt-butler-0.5.0-all.jar
shadowJar {
    archiveClassifier = 'all'
    mergeServiceFiles()

    // Each JavaFX platform JAR contains its own module-info.class.
    // Merging 4 copies without exclusion causes a DuplicatesStrategy error.
    exclude 'module-info.class'

    // Signed JARs include *.SF / *.DSA / *.RSA manifests. Including them in
    // a merged JAR causes SecurityException at startup. Strip them all.
    exclude 'META-INF/LICENSE*'
    exclude 'META-INF/NOTICE*'
    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'
    exclude 'META-INF/INDEX.LIST'

    // ShadowApplicationPlugin wires Main-Class from application.mainClass (PromptButlerApp)
    // through Gradle's copy-spec manifest snapshot, which is captured before doFirst runs.
    // The only reliable override is to rewrite the manifest entry in the finished archive.
    // Launcher is a plain class (not extending Application) that delegates to
    // PromptButlerApp.main(); JavaFX refuses classpath launches when Main-Class
    // directly extends Application.
    //
    // Additionally:
    // 1. macOS OpenJFX ships separate .dylib binaries for x86_64 (mac)
    //    and arm64 (mac-aarch64) with identical root paths in their respective JARs.
    //    We extract both slices for each macOS .dylib and stitch them into a standard
    //    Mach-O Universal (Fat) Binary so the fat JAR runs on both Intel and Apple Silicon Macs.
    // 2. Linux ELF shared libraries (.so) do not support universal binaries.
    //    OpenJFX bundles x86_64 .so files at the root of javafx-graphics-linux.jar.
    //    To support Linux on both x86_64 and AArch64 (ARM64), we move the x86_64 .so files
    //    under native/linux-x86_64/ and package the aarch64 .so files under native/linux-aarch64/.
    //    Root .so entries are excluded so OpenJFX does not blindly extract incompatible AMD64
    //    binaries on AArch64 systems. At startup, Launcher extracts and configures the matching
    //    architecture's libraries.
    doLast {
        def jar = archiveFile.get().asFile
        def tmp = new File(jar.parentFile, "${jar.name}.tmp")

        // Locate x86_64 and aarch64 macOS JavaFX graphics jars from runtimeClasspath
        def runtimeArtifacts = project.configurations.runtimeClasspath.resolvedConfiguration.resolvedArtifacts
        def macX64Jar = runtimeArtifacts.find { it.moduleVersion.id.group == 'org.openjfx' && it.name == 'javafx-graphics' && it.classifier == 'mac' }?.file
        def macArmJar = runtimeArtifacts.find { it.moduleVersion.id.group == 'org.openjfx' && it.name == 'javafx-graphics' && it.classifier == 'mac-aarch64' }?.file
        def linuxX64Jar = runtimeArtifacts.find { it.moduleVersion.id.group == 'org.openjfx' && it.name == 'javafx-graphics' && it.classifier == 'linux' }?.file
        def linuxArmJar = project.configurations.linuxAarch64Natives.resolvedConfiguration.resolvedArtifacts.find { it.moduleVersion.id.group == 'org.openjfx' && it.name == 'javafx-graphics' && it.classifier == 'linux-aarch64' }?.file

        Map<String, byte[]> universalDylibs = [:]
        if (macX64Jar?.exists() && macArmJar?.exists()) {
            Map<String, byte[]> x64Dylibs = [:]
            Map<String, byte[]> armDylibs = [:]

            new java.util.jar.JarFile(macX64Jar).withCloseable { jf ->
                jf.entries().each { entry ->
                    if (entry.name.endsWith('.dylib')) {
                        x64Dylibs[entry.name] = jf.getInputStream(entry).bytes
                    }
                }
            }
            new java.util.jar.JarFile(macArmJar).withCloseable { jf ->
                jf.entries().each { entry ->
                    if (entry.name.endsWith('.dylib')) {
                        armDylibs[entry.name] = jf.getInputStream(entry).bytes
                    }
                }
            }

            // Create Mach-O Universal Binary for each matching dylib
            x64Dylibs.each { name, x64Bytes ->
                byte[] armBytes = armDylibs[name]
                if (armBytes != null) {
                    // Read cputype and cpusubtype from Mach-O 64-bit headers (little endian offset 4 and 8)
                    ByteBuffer bb1 = ByteBuffer.wrap(x64Bytes).order(ByteOrder.LITTLE_ENDIAN)
                    int cp1 = bb1.getInt(4)
                    int cs1 = bb1.getInt(8)

                    ByteBuffer bb2 = ByteBuffer.wrap(armBytes).order(ByteOrder.LITTLE_ENDIAN)
                    int cp2 = bb2.getInt(4)
                    int cs2 = bb2.getInt(8)

                    int fatMagic = 0xcafebabe
                    int alignPow = 14 // 16384 bytes page alignment (required by macOS arm64 loader)
                    int align = 1 << alignPow
                    int headerSize = 8 + 2 * 20
                    int offset1 = (headerSize + align - 1) & ~(align - 1)
                    int offset2 = (offset1 + x64Bytes.length + align - 1) & ~(align - 1)
                    int totalSize = offset2 + armBytes.length

                    byte[] fatData = new byte[totalSize]
                    ByteBuffer outBb = ByteBuffer.wrap(fatData).order(ByteOrder.BIG_ENDIAN)
                    outBb.putInt(0, fatMagic)
                    outBb.putInt(4, 2) // 2 architectures

                    // Slice 1: x86_64
                    outBb.putInt(8, cp1)
                    outBb.putInt(12, cs1)
                    outBb.putInt(16, offset1)
                    outBb.putInt(20, x64Bytes.length)
                    outBb.putInt(24, alignPow)

                    // Slice 2: arm64
                    outBb.putInt(28, cp2)
                    outBb.putInt(32, cs2)
                    outBb.putInt(36, offset2)
                    outBb.putInt(40, armBytes.length)
                    outBb.putInt(44, alignPow)

                    System.arraycopy(x64Bytes, 0, fatData, offset1, x64Bytes.length)
                    System.arraycopy(armBytes, 0, fatData, offset2, armBytes.length)

                    universalDylibs[name] = fatData
                }
            }
        }

        // Collect architecture-segregated Linux .so binaries
        Map<String, byte[]> archLinuxSo = [:]
        if (linuxX64Jar?.exists()) {
            new java.util.jar.JarFile(linuxX64Jar).withCloseable { jf ->
                jf.entries().each { entry ->
                    if (entry.name.endsWith('.so') && !entry.name.contains('/')) {
                        archLinuxSo["native/linux-x86_64/${entry.name}"] = jf.getInputStream(entry).bytes
                    }
                }
            }
        }
        if (linuxArmJar?.exists()) {
            new java.util.jar.JarFile(linuxArmJar).withCloseable { jf ->
                jf.entries().each { entry ->
                    if (entry.name.endsWith('.so') && !entry.name.contains('/')) {
                        archLinuxSo["native/linux-aarch64/${entry.name}"] = jf.getInputStream(entry).bytes
                    }
                }
            }
        }

        def newManifest = new java.util.jar.Manifest()
        newManifest.mainAttributes.put(java.util.jar.Attributes.Name.MANIFEST_VERSION, '1.0')
        newManifest.mainAttributes.put(java.util.jar.Attributes.Name.MAIN_CLASS,
                'com.viruchith.PromptButler.Launcher')
        newManifest.mainAttributes.put(java.util.jar.Attributes.Name.IMPLEMENTATION_TITLE, 'Prompt Butler')
        newManifest.mainAttributes.put(java.util.jar.Attributes.Name.IMPLEMENTATION_VERSION, project.version.toString())

        new java.util.jar.JarOutputStream(new FileOutputStream(tmp), newManifest).withCloseable { out ->
            new java.util.jar.JarFile(jar).withCloseable { src ->
                src.entries().each { entry ->
                    if (entry.name == 'META-INF/MANIFEST.MF') return
                    // Omit root-level Linux .so files to prevent architecture collision on AArch64
                    if (entry.name.endsWith('.so') && !entry.name.contains('/')) return

                    out.putNextEntry(new java.util.jar.JarEntry(entry.name))
                    if (universalDylibs.containsKey(entry.name)) {
                        out.write(universalDylibs[entry.name])
                    } else {
                        src.getInputStream(entry).withCloseable { inn -> out << inn }
                    }
                    out.closeEntry()
                }
            }
            // Append segregated Linux native binaries
            archLinuxSo.each { path, bytes ->
                out.putNextEntry(new java.util.jar.JarEntry(path))
                out.write(bytes)
                out.closeEntry()
            }
        }
        jar.delete()
        tmp.renameTo(jar)
    }
}
